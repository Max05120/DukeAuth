name: CI

on:
  push:
    branches: [ main, scaffold/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dukeauth
        options: >-
          --health-cmd "pg_isready -U postgres" 
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" 
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dukeauth
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-access
      JWT_REFRESH_SECRET: test-refresh
      PASSWORD_PEPPER: test-pepper
      ROOT_DOMAIN: localhost
      RATE_LIMIT_MAX: 200
      S3_BUCKET: dummy
      S3_ENDPOINT: http://localhost:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Corepack
        run: corepack enable
      - name: Use latest pnpm
        run: corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm i --frozen-lockfile=false
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prisma generate
        run: pnpm -w dlx prisma generate --schema packages/db/prisma/schema.prisma
      - name: Prisma migrate
        run: pnpm -w dlx prisma migrate dev --schema packages/db/prisma/schema.prisma --name init --skip-seed
      - name: Apply RLS SQL
        run: psql "$DATABASE_URL" -f infra/sql/rls.sql
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm --filter @dukeauth/api test

